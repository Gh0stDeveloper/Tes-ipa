name: S4NTOS INJECTOR — Source rebuild (experimental)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_from_upstream.py"
      - ".github/workflows/source-rebuild.yml"
      - "docs/SOURCE_REBUILD.md"
  push:
    branches: [feat/s4ntos-v2-source]
    paths:
      - "scripts/build_from_upstream.py"
      - ".github/workflows/source-rebuild.yml"
      - "docs/SOURCE_REBUILD.md"

permissions:
  contents: read

concurrency:
  group: santos-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-source-build:
    name: Rebuild SwiftUI application with S4NTOS branding
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout S4NTOS scripts and branding kit
        uses: actions/checkout@v4

      - name: Fetch exact audited upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/YangJiiii/3105.git "$RUNNER_TEMP/original-3105"
          git -C "$RUNNER_TEMP/original-3105" checkout --quiet a72617ed4c764a65d8aac1e91aca95231e72a2cb
          test -f "$RUNNER_TEMP/original-3105/LICENSE"
          test -f "$RUNNER_TEMP/original-3105/THIRD_PARTY_NOTICES.md"
          test -f "$RUNNER_TEMP/original-3105/ThreeOneOSFive.xcodeproj/project.pbxproj"

      - name: Unpack original S4NTOS artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f S4NTOS_INJECTOR_kit_para_GitHub.zip
          mkdir -p "$RUNNER_TEMP/artwork"
          unzip -q S4NTOS_INJECTOR_kit_para_GitHub.zip 'Assets.xcassets/*' -d "$RUNNER_TEMP/artwork"
          test -f "$RUNNER_TEMP/artwork/Assets.xcassets/AppIcon.appiconset/Contents.json"

      - name: Apply source presentation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_from_upstream.py "$RUNNER_TEMP/original-3105" "$RUNNER_TEMP/artwork"
          grep -q 'name: "TikTok"' "$RUNNER_TEMP/original-3105/ThreeOneOSFive/views/SettingsView.swift"
          grep -q 'S4NTOS INJECTOR' "$RUNNER_TEMP/original-3105/ThreeOneOSFive/views/RepositoryHomeView.swift"

      - name: Build unsigned iOS application
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/original-3105"
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme 3105 \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/xcodebuild.log"
              exit 1
            }
          echo "Xcode build succeeded"

      - name: Package IPA and original license notices
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/"
          cp "$RUNNER_TEMP/original-3105/LICENSE" "$RUNNER_TEMP/package/Payload/3105.app/LICENSE"
          cp "$RUNNER_TEMP/original-3105/THIRD_PARTY_NOTICES.md" "$RUNNER_TEMP/package/Payload/3105.app/THIRD_PARTY_NOTICES.md"
          python3 - "$RUNNER_TEMP/package/Payload/3105.app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          # Xcode may override CFBundleName from PRODUCT_NAME; correct package
          # metadata after the actual macOS build, not only in source Info.plist.
          info['CFBundleDisplayName'] = 'S4NTOS INJECTOR'
          info['CFBundleName'] = 'S4NTOS INJECTOR'
          info['CFBundleShortVersionString'] = '2.2.0'
          info['CFBundleVersion'] = '2200'
          info['AppReleaseDisplayVersion'] = '2.2.0 · S4NTOS CUSTOM'
          info['S4NTOSBuildMarker'] = 'S4NTOS-v2.2.0-HOME-NEW-EMPTY-ABOUT-REPLACED'
          with open(sys.argv[1], 'wb') as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY)
          assert info.get('CFBundleDisplayName') == 'S4NTOS INJECTOR', info
          assert info.get('CFBundleName') == 'S4NTOS INJECTOR', info
          assert info.get('CFBundleShortVersionString') == '2.2.0', info
          assert info.get('CFBundleVersion') == '2200', info
          assert info.get('AppReleaseDisplayVersion') == '2.2.0 · S4NTOS CUSTOM', info
          assert info.get('CFBundleIdentifier') == 'com.s4ntos.injector', info
          assert info.get('UILaunchScreen',{}).get('UIImageName') == 'S4NTOSLaunch', info
          print('Validated S4NTOS 2.2.0 metadata and unique build marker.')
          PY
          # Validate the signed-code input before packaging: links embedded in
          # compiled Mach-O, not just present in patch scripts.
          python3 - "$RUNNER_TEMP/package/Payload/3105.app/3105" <<'PY'
          import pathlib, sys
          binary = pathlib.Path(sys.argv[1]).read_bytes()
          for address in (
              b'https://www.tiktok.com/@s4ntosxiter1',
              b'https://discord.gg/b6xnTpUK5w',
              b'https://t.me/S4ntosOWNER',
              b'https://wa.me/573505589046',
          ):
              assert address in binary, f'Custom contact link not compiled: {address}'
          print('Four S4NTOS links verified inside compiled app binary')
          PY
          (cd "$RUNNER_TEMP/package" && zip -qry "$RUNNER_TEMP/S4NTOS_INJECTOR_v2.2.0_UNSIGNED.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/S4NTOS_INJECTOR_v2.2.0_UNSIGNED.ipa"

      - name: Upload source-built unsigned IPA for GBox/ESign
        uses: actions/upload-artifact@v4
        with:
          name: S4NTOS-INJECTOR-v2.2.0-ABOUT-HOME-NEW
          path: ${{ runner.temp }}/S4NTOS_INJECTOR_v2.2.0_UNSIGNED.ipa
          retention-days: 7
          if-no-files-found: error
