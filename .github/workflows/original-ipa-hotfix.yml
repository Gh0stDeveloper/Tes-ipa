name: S4NTOS INJECTOR — Original IPA 2.2.1 hotfix

on:
  workflow_dispatch:
  push:
    branches: [fix/s4ntos-original-ipa-version]
    paths:
      - "scripts/hotfix_original_ipa.py"
      - ".github/workflows/original-ipa-hotfix.yml"
      - "docs/ORIGINAL_IPA_HOTFIX.md"
  pull_request:
    branches: [main]
    paths:
      - "scripts/hotfix_original_ipa.py"
      - ".github/workflows/original-ipa-hotfix.yml"
      - "docs/ORIGINAL_IPA_HOTFIX.md"

permissions:
  contents: read

concurrency:
  group: santos-original-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact version of trusted scripts
        uses: actions/checkout@v4

      - name: Extract original 2.1 Beta 2 branded IPA kit
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq S4NTOS_INJECTOR_kit_para_GitHub.zip
          mkdir -p "$RUNNER_TEMP/santos-original"
          unzip -q S4NTOS_INJECTOR_kit_para_GitHub.zip \
            'S4NTOS_INJECTOR_unsigned.ipa' 'Assets.xcassets/*' -d "$RUNNER_TEMP/santos-original"
          python3 - "$RUNNER_TEMP/santos-original/S4NTOS_INJECTOR_unsigned.ipa" <<'PY'
          import hashlib, zipfile, plistlib, sys
          with zipfile.ZipFile(sys.argv[1]) as z:
              data = z.read('Payload/3105.app/Info.plist')
              info = plistlib.loads(data)
              assert info['CFBundleShortVersionString'] == '2.1'
              assert info['CFBundleVersion'] == '2'
              assert info['AppReleaseDisplayVersion'] == '2.1 Beta 2'
              assert info['CFBundleExecutable'] == '3105'
              executable = z.read('Payload/3105.app/3105')
              assert len(executable) > 15_000_000, 'This must be the original full binary'
              assert executable.count(b'https://api.github.com/repos/YangJiiii/3105/releases/latest') == 1
              print('Original IPA verified, executable SHA256:', hashlib.sha256(executable).hexdigest())
          PY

      - name: Recompile previously tested icon and splash
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/compile_ipa.sh \
            "$RUNNER_TEMP/santos-original/Assets.xcassets" \
            "$RUNNER_TEMP/santos-original/S4NTOS_INJECTOR_unsigned.ipa" \
            "$RUNNER_TEMP/santos-original/compiled.ipa"

      - name: Patch version and disable inherited legacy update warning
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hotfix_original_ipa.py \
            "$RUNNER_TEMP/santos-original/compiled.ipa" \
            "$RUNNER_TEMP/S4NTOS_INJECTOR_2.2.1_ORIGINAL_UNSIGNED.ipa"

      - name: Verify minimal binary delta and app identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/santos-original/S4NTOS_INJECTOR_unsigned.ipa" \
            "$RUNNER_TEMP/S4NTOS_INJECTOR_2.2.1_ORIGINAL_UNSIGNED.ipa" <<'PY'
          import sys, zipfile, plistlib
          with zipfile.ZipFile(sys.argv[1]) as original, zipfile.ZipFile(sys.argv[2]) as result:
              path='Payload/3105.app/'
              original_exe=original.read(path+'3105')
              output_exe=result.read(path+'3105')
              src=b'https://api.github.com/repos/YangJiiii/3105/releases/latest'
              dst=b'https://api.github.com/repos/YangJiiii/3105/releases/nosync'
              assert src in original_exe and dst in output_exe
              assert output_exe.replace(dst,src)==original_exe, 'Unexpected modification to 2.1 Beta 2 original executable'
              info=plistlib.loads(result.read(path+'Info.plist'))
              assert info['CFBundleShortVersionString']=='2.2.1'
              assert info['CFBundleVersion']=='2201'
              assert info['CFBundleName']==info['CFBundleDisplayName']=='S4NTOS INJECTOR'
              assert info['CFBundleIdentifier']=='com.s4ntos.injector'
              assert info['S4NTOSBuildMarker']=='S4NTOS-ORIGINAL-2.1-BETA2-VERSION-HOTFIX-2201'
              assert info['AppReleaseDisplayVersion']=='2.2.1 · S4NTOS INJECTOR'
              for language in ('en','vi','zh-Hans'):
                  data=plistlib.loads(result.read(path+language+'.lproj/Localizable.strings'))
                  assert data['settings.about'].endswith('S4NTOS INJECTOR')
              assert result.testzip() is None
              print('PASS: rebuilt IPA uses original 2.1 Beta 2 executable (one exact-length URL change only)')
              print('PASS: version 2.2.1 build 2201 and previously customized branding')
          PY

      - name: Upload GBox/ESign unsigned original IPA
        uses: actions/upload-artifact@v4
        with:
          name: S4NTOS-INJECTOR-2.2.1-ORIGINAL-IPA
          path: ${{ runner.temp }}/S4NTOS_INJECTOR_2.2.1_ORIGINAL_UNSIGNED.ipa
          retention-days: 7
          if-no-files-found: error
